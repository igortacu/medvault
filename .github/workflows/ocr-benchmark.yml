name: OCR benchmark contracts
on:
  pull_request:
    paths: ['experiments/ocr_benchmark/**', '.github/workflows/ocr-benchmark.yml']
  push:
    paths: ['experiments/ocr_benchmark/**', '.github/workflows/ocr-benchmark.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/ocr_benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
